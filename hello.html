<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello</title>

    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          "Noto Sans",
          "Apple Color Emoji",
          "Segoe UI Emoji";
        line-height: 1.5;
        background: #f6f7fb;
        color: #0f172a;
      }

      .page {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .card {
        width: min(44rem, 100%);
        border-radius: 14px;
        border: 1px solid #e2e8f0;
        background: #ffffff;
        padding: 2.5rem;
        box-shadow:
          0 10px 30px rgba(2, 6, 23, 0.08),
          0 1px 2px rgba(2, 6, 23, 0.06);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 2.75rem);
        letter-spacing: -0.03em;
      }

      p {
        margin: 0.75rem 0 0;
        color: #334155;
        font-size: 1.125rem;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1220;
          color: #f8fafc;
        }

        .card {
          background: #0f172a;
          border-color: #1f2937;
          box-shadow: none;
        }

        p {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="hello-title">
        <h1 id="hello-title">Hello</h1>
        <p>Welcome to the Pantheon bot playground.</p>
      </section>
    </main>
  </body>
</html>
